<!-- HTML basic document structure -->
<!DOCTYPE html>
<html>
<head>
    <title>My Page</title>
</head>
<body>
    <h1>Heading</h1>
    <p>Paragraph text</p>
</body>
</html>

<!-- HTML forms with input elements -->
<form>
    <input type="text" name="username">
    <input type="submit" value="Send">
</form>

<!-- HTML lists -->
<ul>
    <li>Item one</li>
    <li>Item two</li>
</ul>
<ol>
    <li>First</li>
    <li>Second</li>
</ol>

<!-- HTML tables -->
<table>
    <tr><th>Name</th><th>Age</th></tr>
    <tr><td>Alice</td><td>25</td></tr>
</table>
